<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div id="canvas-container" aria-hidden="true"></div>

  <main class="overlay">
    <header class="clock-widget">
      <h1 class="visually-hidden">New Tab</h1>
      <time id="clock" class="clock-time"></time>
      <p id="date" class="clock-date"></p>
    </header>

    <search class="search-container">
      <form id="search-form" class="search-form" action="https://www.google.com/search" method="GET">
        <label for="search-input" class="visually-hidden">Search the web</label>
        <input
          type="search"
          id="search-input"
          name="q"
          placeholder="Search the web..."
          autocomplete="off"
          autocorrect="off"
          autocapitalize="none"
          spellcheck="false"
          enterkeyhint="search"
          required
        >
        <button type="submit" class="search-btn" aria-label="Search">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </form>
    </search>
  </main>

  <script src="dist/newtab.js"></script>
</body>
</html>
