<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div id="canvas-container" aria-hidden="true"></div>

  <aside id="weather-widget" class="pmd-weather" aria-label="Weather">
    <div id="weather-display" class="pmd-weather-display">
      <svg
        id="weather-icon"
        class="pmd-weather-icon"
        width="36"
        height="36"
        viewBox="0 0 16 16"
        shape-rendering="crispEdges"
        aria-hidden="true"
      ></svg>
      <div class="pmd-weather-info">
        <div class="pmd-weather-top">
          <span id="weather-temp" class="pmd-weather-temp">--°C</span>
          <span id="weather-condition" class="pmd-weather-condition">Checking...</span>
        </div>
        <button type="button" id="weather-location-btn" class="pmd-weather-loc-btn" title="Change city">
          <span id="weather-location" class="pmd-weather-location">Locating...</span>
          <span class="pmd-weather-edit-cue" aria-hidden="true">✎</span>
        </button>
      </div>
    </div>

    <form id="weather-city-form" class="pmd-city-form" hidden>
      <label for="weather-city-input" class="visually-hidden">City name</label>
      <input
        type="text"
        id="weather-city-input"
        name="city"
        placeholder="City name..."
        autocomplete="off"
        autocorrect="off"
        autocapitalize="words"
        spellcheck="false"
        enterkeyhint="done"
        required
      >
      <button type="submit" class="pmd-btn">OK</button>
      <button type="button" id="weather-gps-btn" class="pmd-btn" title="Use current location" aria-label="Use current location">◎</button>
    </form>
  </aside>

  <article id="pokedex-widget" class="pmd-pokedex" aria-label="Pokémon Info" hidden>
    <canvas id="pokedex-sprite" class="media pmd-pokedex-sprite" width="40" height="40" aria-hidden="true"></canvas>
    <header class="pmd-pokedex-header">
      <div class="pmd-pokedex-title-row">
        <span id="pokedex-number" class="pmd-pokedex-number">#001</span>
        <h2 id="pokedex-name" class="pmd-pokedex-name">Bulbasaur</h2>
        <span id="pokedex-variant" class="pmd-pokedex-variant" hidden>★ SHINY</span>
      </div>
      <button type="button" id="pokedex-close-btn" class="pmd-pokedex-close" aria-label="Close Pokémon info">×</button>
    </header>
    <div class="pmd-pokedex-content">
      <ul id="pokedex-types" class="pmd-pokedex-types" aria-label="Types"></ul>
      <p id="pokedex-flavor" class="pmd-pokedex-flavor"></p>
    </div>
  </article>

  <main class="overlay">
    <header class="clock-widget">
      <h1 class="visually-hidden">New Tab</h1>
      <time id="clock" class="clock-time"></time>
      <p id="date" class="clock-date"></p>
    </header>

    <search class="search-container">
      <form id="search-form" class="search-form" action="https://www.google.com/search" method="GET">
        <span class="pmd-search-prompt" aria-hidden="true">▶</span>
        <label for="search-input" class="visually-hidden">Search</label>
        <input
          type="search"
          id="search-input"
          name="q"
          placeholder="Search"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="none"
          spellcheck="false"
          enterkeyhint="search"
          required
        >
        <button type="submit" class="search-btn" aria-label="Search">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </form>
    </search>
  </main>

  <script src="dist/newtab.js"></script>
</body>
</html>
